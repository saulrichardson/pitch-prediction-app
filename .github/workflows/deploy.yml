name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: pitch-sequence-serverless-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY_NAME: pitch-prediction-app
  SERVERLESS_WEB_IMAGE_TAG: serverless-${{ github.sha }}
  SERVERLESS_WEB_RESERVED_CONCURRENCY: "10"
  MODEL_ECR_REPOSITORY_NAME: pitch-prediction-model-api
  MODEL_IMAGE_TAG: model-serverless-${{ github.sha }}
  MODEL_LAMBDA_FUNCTION_NAME: pitch-sequence-serverless-model-lambda
  MODEL_LAMBDA_ALIAS: live
  MODEL_LAMBDA_INVOKE_TARGET: pitch-sequence-serverless-model-lambda:live
  MODEL_LAMBDA_PROVISIONED_CONCURRENCY: "0"
  MODEL_LAMBDA_RESERVED_CONCURRENCY: "1"
  MODEL_LAMBDA_TIMEOUT_SECONDS: "300"
  MODEL_LAMBDA_MEMORY_MB: "1024"
  CUSTOM_DOMAIN_NAME: baseball.saulrichardson.io
  ACM_CERTIFICATE_ARN: arn:aws:acm:us-east-1:492205018164:certificate/62136baf-0216-4c9a-acbc-7e6e1694b0f0

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install uv
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:model
      - run: npm run lint
      - run: npm run build
      - run: npm run verify:local
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Wait for ACM certificate
        if: ${{ env.ACM_CERTIFICATE_ARN != '' }}
        run: |
          for i in $(seq 1 60); do
            status="$(aws acm describe-certificate \
              --region us-east-1 \
              --certificate-arn "$ACM_CERTIFICATE_ARN" \
              --query "Certificate.Status" \
              --output text)"
            echo "ACM certificate status: $status"
            if [ "$status" = "ISSUED" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "ACM certificate was not issued in time. Confirm the Cloudflare DNS validation CNAME exists." >&2
          exit 1
      - name: Build, push, and deploy model Lambda
        run: bash scripts/deploy-serverless-model.sh
      - name: Prepare and publish a complete replay
        env:
          STORAGE_MODE: dynamodb
          DYNAMODB_TABLE_NAME: pitch-sequence-serverless-state
          MODEL_BACKEND: lambda
        run: |
          MODEL_VERSION="$(aws lambda get-alias --function-name "$MODEL_LAMBDA_FUNCTION_NAME" --name "$MODEL_LAMBDA_ALIAS" --query FunctionVersion --output text)"
          export MODEL_LAMBDA_FUNCTION_NAME="${MODEL_LAMBDA_FUNCTION_NAME}:${MODEL_VERSION}"
          npm run prepare:replay -- --publish --model-artifact "${MODEL_LAMBDA_FUNCTION_NAME}:${MODEL_IMAGE_TAG}:normalizer-v3:samples8"
      - name: Build, publish assets, and deploy web
        run: bash scripts/deploy-serverless-web.sh
      - name: Resolve serverless URL
        id: app-url
        run: |
          URL="$(aws cloudformation describe-stacks \
            --stack-name PitchSequenceServerlessStack \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ServerlessWebUrl'].OutputValue" \
            --output text)"
          if [ -z "$URL" ] || [ "$URL" = "None" ]; then
            echo "Could not resolve ServerlessWebUrl" >&2
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Wait for serverless readiness
        run: |
          for i in $(seq 1 60); do
            code="$(curl -sS -o /tmp/ready.json -w "%{http_code}" "${{ steps.app-url.outputs.url }}/ready" || true)"
            cat /tmp/ready.json || true
            echo
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Serverless app did not become ready." >&2
          exit 1
      - name: Verify serverless product flow
        env:
          BASE_URL: ${{ steps.app-url.outputs.url }}
        run: |
          npm run verify:product
          npm run verify:catalog
